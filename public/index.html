<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>K20 GT 小黑板</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="tool" aria-labelledby="page-title">
        <div class="heading">
          <p class="eyebrow">K20 GT 屏幕投递</p>
          <h1 id="page-title">写到小黑板</h1>
          <p class="hint">短消息更可靠。发送 token 只保存在这个浏览器里，不要填写 receiver token。</p>
        </div>

        <form id="sender-form" class="form" novalidate>
          <label class="field">
            <span>发送 token</span>
            <input
              id="send-token"
              name="token"
              type="password"
              autocomplete="off"
              placeholder="只填写 SEND_TOKEN"
              required
            >
          </label>

          <label class="remember">
            <input id="remember-token" type="checkbox" checked>
            <span>在这个浏览器记住发送 token</span>
          </label>

          <label class="field">
            <span>要显示的文字</span>
            <textarea
              id="message-text"
              name="text"
              rows="5"
              placeholder="今天别熬夜"
              required
            ></textarea>
          </label>

          <fieldset class="intent-group" id="duration-group">
            <legend>保留多久</legend>
            <label class="intent-option">
              <input type="radio" name="duration" value="30" checked>
              <span>
                <strong>30 秒</strong>
                <small>看一眼就释放</small>
              </span>
            </label>
            <label class="intent-option">
              <input type="radio" name="duration" value="300">
              <span>
                <strong>5 分钟</strong>
                <small>短提醒</small>
              </span>
            </label>
            <label class="intent-option">
              <input type="radio" name="duration" value="1800">
              <span>
                <strong>30 分钟</strong>
                <small>放一会儿</small>
              </span>
            </label>
            <label class="intent-option">
              <input type="radio" name="duration" value="3600">
              <span>
                <strong>1 小时</strong>
                <small>稍长一点</small>
              </span>
            </label>
          </fieldset>

          <div class="actions">
            <button id="send-button" class="primary" type="submit">写上去</button>
            <button id="clear-button" class="secondary" type="button">清空小黑板</button>
          </div>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <section class="display-status" aria-labelledby="display-status-title">
          <div class="display-status-header">
            <div>
              <p class="eyebrow">远程显示状态</p>
              <h2 id="display-status-title">她那边现在怎样</h2>
            </div>
            <button id="refresh-status-button" class="secondary compact" type="button">刷新</button>
          </div>

          <dl class="status-grid">
            <div>
              <dt>receiver</dt>
              <dd id="receiver-state">未刷新</dd>
            </div>
            <div>
              <dt>勿扰</dt>
              <dd id="dnd-state">未刷新</dd>
            </div>
            <div>
              <dt>小黑板</dt>
              <dd id="board-state">未刷新</dd>
            </div>
            <div>
              <dt>过期时间</dt>
              <dd id="expires-state">未刷新</dd>
            </div>
          </dl>
          <p id="status-detail" class="status-detail">勿扰由 receiver 本地控制。</p>
        </section>

        <section class="board-history" aria-labelledby="board-history-title">
          <div>
            <p class="eyebrow">最近小黑板</p>
            <h2 id="board-history-title">刚刚写过什么</h2>
          </div>
          <p id="history-state" class="history-state">输入 SEND_TOKEN 后会显示最近小黑板。</p>
          <div id="history-list" class="history-list" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
